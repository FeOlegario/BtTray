# Compila o BtTray com o build.ps1 (csc.exe do .NET Framework 4.8, que já vem no Windows).
# - Em pull requests e pushes na main: só compila, para pegar erros de build cedo.
# - Ao enviar uma tag de versão (ex.: v1.0.0): compila e publica o BtTray.exe numa Release.
name: Build e Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar
        shell: pwsh
        run: ./build.ps1

      # Antes de publicar: tag = versão, notas em inglês e português, nenhum dado privado (ver build.yml).
      - name: Checagens de publicação
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TERMOS_PRIVADOS: ${{ secrets.TERMOS_PRIVADOS }}
        run: ./.github/scripts/checar-publicacao.ps1 -Tag '${{ github.ref_name }}'

      - name: Conferir versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $ver = (Get-Item bin\BtTray.exe).VersionInfo.FileVersion
          Write-Host "Tag: $tag  |  FileVersion do .exe: $ver"
          if (-not ($ver -eq $tag -or $ver -eq "$tag.0")) {
            throw "A tag v$tag não bate com o AssemblyFileVersion ($ver) em src/Program.cs. Atualize a versão antes de criar a tag."
          }

      - name: Gerar SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash bin\BtTray.exe -Algorithm SHA256).Hash.ToLower()
          "$h  BtTray.exe" | Out-File -Encoding ascii bin\BtTray.exe.sha256
          Get-Content bin\BtTray.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: BtTray
          path: |
            bin/BtTray.exe
            bin/BtTray.exe.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # histórico completo e tags, para listar os commits desde a versão anterior
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: BtTray

      # As notas vêm de release-notes/<tag>.md (o que mudou, em inglês e português). Sem esse arquivo, usa a lista
      # de commits desde a tag anterior, para as notas não ficarem vazias: o --generate-notes só lista pull requests.
      - name: Montar notas da versão
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ -f "release-notes/$TAG.md" ]; then
            cp "release-notes/$TAG.md" notes.md
            echo "Usando release-notes/$TAG.md"
          else
            echo "::warning::release-notes/$TAG.md não existe; usando a lista de commits."
            prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
            range="${prev:+$prev..}$TAG"
            commits=$(git log --no-merges --pretty='- %s (%h)' "$range")
            if [ -n "$commits" ]; then
              printf '## O que mudou / What changed\n\n%s\n' "$commits" > notes.md
            else
              : > notes.md
            fi
          fi
          cat notes.md

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" BtTray.exe BtTray.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "BtTray $TAG" \
            --notes-file notes.md \
            --generate-notes
